<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Lucy's Reading Detective</title>
<style>
:root{
  --ground:#F1F6FB; --paper:#FFFFFF; --ink:#1D2B45; --muted:#56678A; --line:#D5DFEC;
  --accent:#2F6FD6; --accent-ink:#FFFFFF; --accent-soft:#E3EDFC;
  --hl:#FFE45C; --hl-ink:#1D2B45; --near:#C99A00;
  --good:#17895C; --good-soft:#DDF4EA; --oops:#C9502D; --oops-soft:#FCE6DE;
  --lock:#A9B6CB;
  --shadow:0 2px 0 #D5DFEC;
  --display:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --read:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0F1726; --paper:#172238; --ink:#EAF0FA; --muted:#9FB0CC; --line:#2A3A57;
    --accent:#7FA8F5; --accent-ink:#0F1726; --accent-soft:#1F3150; --near:#FFD84D;
    --good:#3CC48D; --good-soft:#15352B; --oops:#FF8A66; --oops-soft:#3A2119;
    --lock:#4A5B78; --shadow:0 2px 0 #0A101C;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0F1726; --paper:#172238; --ink:#EAF0FA; --muted:#9FB0CC; --line:#2A3A57;
  --accent:#7FA8F5; --accent-ink:#0F1726; --accent-soft:#1F3150; --near:#FFD84D;
  --good:#3CC48D; --good-soft:#15352B; --oops:#FF8A66; --oops-soft:#3A2119;
  --lock:#4A5B78; --shadow:0 2px 0 #0A101C;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--read);font-size:18px;line-height:1.55}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,6vw,44px);font-weight:700}
h2{font-size:clamp(24px,4.5vw,32px);font-weight:700}
h3{font-size:20px;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
mark{background:var(--hl);color:var(--hl-ink);border-radius:4px;padding:0 3px}

/* home */
.top{display:flex;gap:16px;align-items:center;margin-block:8px 20px}
.mag{flex:none;width:64px;height:64px}
.top p{color:var(--muted);max-width:60ch;margin-top:6px}
.trail{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.case{width:100%;display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;text-align:left;
  background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow)}
.case:hover{border-color:var(--accent)}
.case .n{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:24px;
  background:var(--accent-soft);color:var(--accent)}
.case.solved .n{background:var(--good-soft);color:var(--good)}
.case .t{font-family:var(--display);font-weight:700;font-size:21px}
.stars{display:flex;gap:2px}
.stars svg{width:24px;height:24px}
.star-on{fill:#F5B400}
.star-off{fill:none;stroke:var(--lock);stroke-width:1.6}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}

/* buttons */
.btn{min-height:52px;padding:10px 22px;border-radius:999px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);
  font-family:var(--display);font-weight:700;font-size:19px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{min-height:40px;font-size:15px;padding:6px 16px}
.btn:hover{filter:brightness(1.06)}

/* lesson frame */
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.back{background:none;border:none;color:var(--accent);font-family:var(--display);font-weight:700;font-size:17px;cursor:pointer;padding:6px 0}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:14px;padding:4px 12px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted)}
.steps span.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.steps span.past{border-color:var(--good);color:var(--good)}
.lhead{margin-bottom:18px}
.sk{color:var(--muted);font-size:15px}
.lhead .sk{margin-top:4px}

.card{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:22px}
.learn{display:grid;gap:16px;max-width:720px;font-size:20px}
.learn .lead{font-size:22px}
.lrow{display:flex;justify-content:flex-end}
.habits{margin:0;padding-left:0;list-style:none;display:grid;gap:10px;counter-reset:h}
.habits li{counter-increment:h;display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.habits li::before{content:counter(h);width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-family:var(--display);font-weight:700}
.ex{border:2px dashed var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.ex-l{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tf{overflow-x:auto}
.tf table{border-collapse:collapse;width:100%;min-width:420px;font-size:18px}
.tf th,.tf td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.tf th{font-size:14px;color:var(--muted);font-weight:700}
.yes{color:var(--good);font-weight:700}
.nope{color:var(--oops);font-weight:700}
.tip{background:var(--accent-soft);border-radius:14px;padding:14px 16px}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.duo > div{border:2px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:4px}
.duo .w{color:var(--muted);font-size:17px}
.go{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.mm{background:var(--accent-soft);border-radius:14px;padding:14px 16px;font-size:20px}

/* question layout */
.qa{display:grid;grid-template-columns:1.1fr 1fr;grid-template-areas:"passage question";gap:18px;align-items:start}
.qa .passage{grid-area:passage}
.qa .question{grid-area:question;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:780px){
  .qa{grid-template-columns:1fr;grid-template-areas:"question" "passage"}
  .qa .question{position:static}
}
.passage{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:20px 22px;display:grid;gap:12px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ptext{font-size:22px;line-height:1.75;display:grid;gap:14px}
.pn{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);
  font-family:var(--display);font-size:14px;color:var(--muted);margin-right:6px;vertical-align:3px}
.s{border-radius:6px;padding:1px 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background .2s}
.s.tap{cursor:pointer;background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--accent)}
.s.tap:hover{background:color-mix(in srgb,var(--hl) 55%,transparent);color:inherit}
.s.sel{background:color-mix(in srgb,var(--hl) 70%,transparent);color:var(--hl-ink);outline:3px solid var(--accent);outline-offset:1px}
.s.hl{background:var(--hl);color:var(--hl-ink);box-shadow:none}
.s.near{background:color-mix(in srgb,var(--hl) 30%,transparent);box-shadow:inset 0 -2px 0 var(--near);cursor:default}
.s.no{background:var(--oops-soft);box-shadow:inset 0 -2px 0 var(--oops);cursor:default}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
  background:var(--paper);border:2px solid var(--accent);border-radius:16px;padding:10px 12px}
.listen{display:inline-flex;align-items:center;gap:6px;background:none;border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;
  font-size:14px;color:var(--muted);cursor:pointer;flex:none}
.listen svg{width:16px;height:16px;fill:currentColor}
.listen:hover{border-color:var(--accent);color:var(--accent)}

.question{background:var(--paper);border:2px solid var(--accent);border-radius:20px;padding:20px 22px;display:grid;gap:14px}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.03em}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.dots i.cur{border-color:var(--accent)}
.dots i.ok{background:var(--good);border-color:var(--good)}
.dots i.miss{background:var(--oops);border-color:var(--oops)}
.qtext{font-size:22px;font-weight:700;line-height:1.4}
.qtext .concl{display:block;margin-top:6px;font-weight:400;background:var(--accent-soft);border-radius:10px;padding:8px 12px}
.step{font-size:16px;font-weight:700;color:var(--accent)}
.opts{display:grid;gap:10px}
.opts.wait{opacity:.45}
.opt{text-align:left;min-height:56px;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--paper);cursor:pointer;font-size:19px;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--oops);background:var(--oops-soft);text-decoration:line-through;text-decoration-color:var(--oops)}
.chips{display:grid;gap:8px}
.chip{text-align:left;min-height:52px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--paper);cursor:pointer;font-size:18px}
.chip:hover:not([disabled]){border-color:var(--accent)}
.chip[disabled]{opacity:.35;cursor:default}
.slots{display:grid;gap:8px;counter-reset:sl}
.slot{counter-increment:sl;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;min-height:48px;padding:6px 12px;border-radius:12px;border:2px dashed var(--line);font-size:18px}
.slot::before{content:counter(sl);width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:16px}
.slot.full{border-style:solid;border-color:var(--accent)}
.slot.right{border-color:var(--good);background:var(--good-soft)}
.fb{border-radius:14px;padding:12px 14px;font-size:18px;display:grid;gap:8px}
.fb .listen{justify-self:start}
.fb.good{background:var(--good-soft);color:var(--ink);border:2px solid var(--good)}
.fb.oops{background:var(--oops-soft);color:var(--ink);border:2px solid var(--oops)}
.fb.info{background:var(--hl);color:var(--hl-ink)}
.fb.info .listen{color:var(--hl-ink);border-color:color-mix(in srgb,var(--hl-ink) 30%,transparent)}
.fb b{font-family:var(--display)}

.center{display:grid;gap:16px;justify-items:start;max-width:640px}
.big-stars{display:flex;gap:6px}
.big-stars svg{width:48px;height:48px}
.stat{font-size:20px}
.stat .num{font-weight:700}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .35s ease-out}
  @keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
}
</style>

<div class="wrap" id="app"></div>

<script>
/* Sentence indices are global across a passage's paragraphs, starting at 0. */
const PASSAGES = {
  /* lesson 1: recount a story */
  kite:{title:`The Kite Contest`,paras:[[
    `Jada wanted to win the kite contest at the park.`,
    `First, she built a kite out of paper, sticks, and string.`,
    `When she tried to fly it, the kite crashed into a bush and tore.`,
    `Jada felt like giving up.`,
    `Then her brother helped her tape the hole and add a longer tail.`,
    `On the day of the contest, the wind was strong.`,
    `Jada's kite flew higher than all the others.`,
    `She won a blue ribbon and hung it on her wall.`]]},
  sandcastle:{title:`The Sandcastle Contest`,paras:[[
    `Every summer, the town has a sandcastle contest at the beach.`,
    `This year, Omar and his sister Lina wanted to win.`,
    `They worked all morning to build a castle with four tall towers.`],[
    `Just as they finished, a big wave rushed up the beach.`,
    `It knocked down two of the towers!`,
    `Lina wanted to quit, but Omar had an idea.`,
    `"Let's build a wall of sand to keep the waves away," he said.`,
    `They dug a deep ditch and piled the sand into a thick wall.`,
    `Then they fixed the towers and added shells for windows.`],[
    `When the judges came, the wall was still standing.`,
    `The judges gave Omar and Lina the prize for the smartest castle.`,
    `On the way home, Lina said, "I'm glad we didn't give up."`]]},
  lemonade:{title:`Nia's Lemonade Stand`,paras:[[
    `Nia wanted to buy a new book about space.`,
    `The book cost ten dollars, but she only had two.`,
    `So she set up a lemonade stand in front of her house.`],[
    `At first, nobody stopped.`,
    `Cars zoomed by, and people walked past without looking.`,
    `Nia felt like giving up.`,
    `Then her neighbor, Mr. Diaz, gave her an idea.`,
    `"Make a big, bright sign," he said, "so people can see you."`,
    `Nia painted a sign with a yellow lemon and the words "Cold Lemonade!"`],[
    `Soon, people began to stop.`,
    `By the end of the day, Nia had sold twenty cups.`,
    `The next morning, she walked to the store and bought her space book.`]]},
  /* lessons 2 and 3: main ideas, supporting details */
  penguins:{title:`Penguins`,paras:[[
    `Penguins are birds that are built for cold water.`,
    `Their thick feathers keep them warm and dry.`,
    `A layer of fat under their skin keeps the cold out.`,
    `Their wings work like flippers to help them swim fast.`]]},
  recess:{title:`Recess`,paras:[[
    `At recess, some kids race each other across the field.`,
    `Others climb to the top of the jungle gym.`,
    `A group jumps rope by the fence.`,
    `A few friends play tag near the swings.`]]},
  frogs:{title:`From Egg to Frog`,paras:[[
    `Frogs start their lives in the water.`,
    `A mother frog lays her eggs in a pond.`,
    `The eggs hatch into tiny tadpoles with long tails.`,
    `The tadpoles swim and eat plants under the water.`],[
    `Slowly, the tadpoles grow back legs and then front legs.`,
    `Their tails get shorter and shorter.`,
    `Soon they can breathe air and hop onto land.`,
    `Little by little, each tadpole changes into a frog.`]]},
  beavers:{title:`Busy Beavers`,paras:[[
    `Beavers are amazing builders.`,
    `They cut down trees with their strong front teeth.`,
    `Then they pile up sticks, rocks, and mud to make a dam across a stream.`,
    `The dam holds back the water and makes a quiet pond.`],[
    `Beavers are also made for swimming.`,
    `Their back feet are webbed like a duck's feet.`,
    `Their flat tail helps them steer in the water.`,
    `They can stay underwater for up to fifteen minutes.`],[
    `In the pond, beavers build a home called a lodge.`,
    `The door to the lodge is underwater, so enemies like wolves cannot get in.`,
    `Inside, there is a dry room where the whole family sleeps.`,
    `In winter, they stay in the lodge and eat bark from branches they saved.`]]},
  camels:{title:`Desert Camels`,paras:[[
    `Camels are built for life in the hot, dry desert.`,
    `Their long, thick eyelashes keep blowing sand out of their eyes.`,
    `They can close their noses to keep sand out, too.`,
    `Their wide, flat feet help them walk on soft sand without sinking.`],[
    `Camels can go a long time without food or water.`,
    `When they find water, they can drink a huge amount very fast.`,
    `Their humps store fat, not water.`,
    `The fat gives them energy when there is no food around.`],[
    `Camels carry heavy bags and people across the desert.`,
    `Some families drink camel milk every day.`,
    `Others use soft camel hair to make warm blankets.`]]},
  classgarden:{title:`Our Class Garden`,paras:[[
    `Our class garden needs a lot of care.`,
    `Every morning, we water the plants.`,
    `On Fridays, we pull out the weeds.`,
    `My friend Ben has a new red bike.`,
    `We also put up a net so birds can't eat the seeds.`]]},
  owls:{title:`Night Owls`,paras:[[
    `Owls have amazing eyes.`,
    `Their big eyes help them see in the dark.`,
    `They can spot a mouse from far away.`,
    `An owl can turn its head far around to look behind it.`],[
    `Owls also have amazing ears.`,
    `They can hear a mouse moving under the snow.`,
    `Some owls have one ear higher than the other.`,
    `This helps them tell exactly where a sound comes from.`]]},
  hummingbirds:{title:`Hummingbirds`,paras:[[
    `Hummingbirds are some of the smallest birds in the world.`,
    `Some are about as long as your thumb.`,
    `A few weigh less than a penny.`],[
    `Hummingbirds are also very fast.`,
    `Their wings can flap more than fifty times a second.`,
    `They can even fly backward!`,
    `Many birds build their nests in trees.`],[
    `To get energy, hummingbirds drink nectar from flowers.`,
    `Their long, thin beaks reach deep inside the flowers.`,
    `They visit hundreds of flowers every day.`]]},
  turtles:{title:`Sea Turtles`,paras:[[
    `Sea turtles spend almost their whole lives in the ocean.`,
    `Their flat, paddle-like flippers push them through the water.`,
    `They can hold their breath for a long time.`,
    `Some swim thousands of miles across the sea.`],[
    `But sea turtles must come to land to lay their eggs.`,
    `A mother turtle crawls onto a beach at night.`,
    `She digs a hole in the sand and lays her eggs inside.`,
    `Seagulls often fly over the beach looking for fish.`],[
    `After about two months, the baby turtles hatch.`,
    `They dig their way out of the sand.`,
    `Then they race down the beach to the water.`]]},
  /* lesson 4: recount informational text */
  honey:{title:`How Honey Is Made`,paras:[[
    `Honey starts with flowers.`,
    `First, a honeybee visits many flowers. It drinks a sweet juice called nectar.`,
    `The bee keeps the nectar in a special honey stomach and flies back to the hive.`,
    `Next, the bee passes the nectar to another bee inside the hive.`,
    `The bees spread the nectar into tiny wax rooms called cells.`,
    `Then the bees fan their wings to dry the nectar until it turns thick and sticky.`,
    `Finally, they cover each cell with a wax lid.`,
    `Now the honey is ready, and it can stay good for a very long time.`]]},
  butterfly:{title:`How a Butterfly Grows`,paras:[[
    `A butterfly goes through four stages as it grows.`,
    `First, a mother butterfly lays a tiny egg on a leaf.`],[
    `Next, a caterpillar hatches from the egg.`,
    `The caterpillar eats and eats, and it grows bigger every day.`,
    `Some caterpillars have bright stripes.`],[
    `Then the caterpillar makes a hard shell around itself called a chrysalis.`,
    `Inside, its body changes in amazing ways.`],[
    `Finally, a butterfly comes out of the chrysalis.`,
    `Its wings are soft and wet at first.`,
    `It waits for them to dry, and then it flies away to find flowers.`]]},
  octopus:{title:`Clever Octopuses`,paras:[[
    `Octopuses are ocean animals with eight long arms.`,
    `They use their arms to crawl along the sea floor.`,
    `Each arm is covered with suckers that grab and taste things.`],[
    `Octopuses are very good at hiding.`,
    `They can change the color of their skin in less than a second.`,
    `This helps them blend in with rocks and sand.`],[
    `When an enemy gets close, an octopus can squirt dark ink.`,
    `The ink makes a cloud, and the octopus swims away.`,
    `Octopuses also have three hearts.`]]},
  /* lesson 5: characters */
  spelling:{title:`The Spelling Bee`,paras:[[
    `Nora's hands were shaking as she walked up on the stage.`,
    `Her voice was very quiet when she said, "Hello."`,
    `The first word was "because."`,
    `Nora closed her eyes and spelled it slowly.`,
    `"Correct!" said the judge.`,
    `Nora's face lit up with a big smile.`,
    `After the contest, she saw a boy crying because he missed a word.`,
    `Nora sat next to him and said, "You did great. We can practice together for next time."`]]},
  garden:{title:`Mr. Finn's Garden`,paras:[[
    `Mr. Finn lives next door to Theo.`,
    `Every morning, even when it rains, he goes out to pull weeds in his garden.`,
    `His tomatoes are the biggest on the whole street.`],[
    `One day, Theo hit a baseball over the fence.`,
    `It smashed one of Mr. Finn's tomato plants.`,
    `Theo could have run away, but he walked next door, red in the face.`,
    `"I am so sorry," he said. "I hit that ball."`],[
    `Mr. Finn frowned at the broken plant for a long time.`,

    `"Will you help me plant a new one?"`,
    `Theo nodded, and they dug in the dirt together all afternoon.`]]},
  newkid:{title:`The New Kid`,paras:[[
    `On the first day of school, a new girl named Priya stood by the door.`,
    `She held her backpack straps tightly and looked down at the floor.`,
    `At lunch, she sat all by herself.`],[
    `Carlos saw Priya sitting alone.`,
    `He picked up his tray and walked over to her table.`,
    `"Do you want to play tag at recess?" he asked.`,
    `Priya looked up and gave a small smile.`],[
    `At recess, Priya was the fastest runner in the whole class.`,
    `Nobody could tag her!`,
    `She laughed and waved Carlos over to her team.`,
    `By the end of the week, Priya had lots of new friends.`]]}
};

const HELPER = `That's true, but it fits only one sentence. It's a helper, not the main idea.`;
const SMALL = `It's a small detail, not the problem, the fix, or the ending.`;
const TITLE_HELPER = `That fits only one sentence. A good title covers the whole paragraph.`;

/* One lesson per open MobyMax lesson in Lucy's TimeBack course, in course order.
   point:true = in practice, she taps the proof sentence first, then the answer choices open. */
const LESSONS = [
{
  id:`recount-story`, title:`Recount a Story`, mm:`Recount a story`,
  after:`Now go to MobyMax and do "Recount a story." Look for the problem, the fix, the ending, and the lesson.`,
  learnSay:`To recount a story means to tell what happened, in order. Only tell the big parts. Beginning: Who is in it? What goes wrong? Middle: What do they try? End: How does it get fixed? Many stories teach a lesson. Ask: what did the character learn? Watch me. Ana's dog ran away. She put up signs with his picture. She tied a red ribbon on her bike. A neighbor called to say the dog was in his yard. Ana ran over and hugged her dog. Retelling: Ana's dog ran away, so she put up signs. A neighbor saw one and called, and Ana got her dog back. The red ribbon is a tiny detail, so it stays out. Lesson: asking for help can solve a problem.`,
  learn:`
    <p class="lead">To <b>recount</b> a story means to tell what happened, in order. Only tell the big parts.</p>
    <ol class="habits">
      <li><span><b>Beginning:</b> Who is in it? What goes wrong?</span></li>
      <li><span><b>Middle:</b> What do they try?</span></li>
      <li><span><b>End:</b> How does it get fixed?</span></li>
    </ol>
    <p>Many stories also teach a <b>lesson</b>. Ask: What did the character learn?</p>
    <div class="ex"><div class="ex-l">Watch me</div>
      <p>Ana's dog ran away. She put up signs with his picture. She tied a red ribbon on her bike. A neighbor called to say the dog was in his yard. Ana ran over and hugged her dog.</p>
      <p><b>Retelling:</b> Ana's dog ran away, so she put up signs. A neighbor saw one and called, and Ana got her dog back.</p>
      <p>The red ribbon is a tiny detail, so it stays out.</p>
      <p><b>Lesson:</b> Asking for help can solve a problem.</p></div>`,
  guided:[
    {type:`order`,p:`kite`,q:`Put what happened in order.`,items:[`Jada built a kite.`,`The kite crashed and tore.`,`Her brother helped her fix it.`,`Her kite flew highest and she won.`],proof:[1,2,4,6],
      hint:`Look back. What did Jada do first? Then tap them again from the start.`},
    {type:`mc`,p:`kite`,q:`What was Jada's problem?`,opts:[`Her kite crashed and tore.`,`The wind was too strong.`,`Her brother would not help.`],ans:0,proof:[2],point:true,
      hint:`A problem is something that goes wrong. Find the sentence where something goes wrong for Jada.`},
    {type:`mc`,p:`kite`,q:`Which part is NOT important to retell?`,opts:[`Her kite had paper, sticks, and string.`,`Her kite crashed into a bush and tore.`,`Her kite flew higher than all the others.`],ans:0,proof:[1],
      hint:`Big parts are the problem, the fix, and the ending. Which one is a tiny detail?`,
      optHints:{1:`The crash is the problem, so it's a big part!`,2:`That's how the story ends, so it's a big part!`}},
    {type:`mc`,p:`kite`,q:`Which is the BEST retelling of the story?`,opts:[
      `Jada built a kite, but it crashed and tore. Her brother helped her fix it. At the contest, it flew highest and she won.`,
      `Jada's kite was made of paper, sticks, and string. It had a long tail. The wind was strong, and she hung a ribbon on her wall.`,
      `Jada won a blue ribbon at the contest. Then she built a kite, and it crashed into a bush. Then her brother helped her fix it.`],ans:0,proof:[1,2,4,6],
      hint:`Check each one. Does it tell the problem? Is it in the right order?`,
      optHints:{1:`That one has tiny details, but it skips the problem: the crash!`,2:`That one has the big events, but the order is mixed up. What happened first?`},
      why:`It has the big events (the problem, the fix, and the win) in the right order.`},
    {type:`mc`,p:`kite`,q:`What lesson does Jada's story teach?`,opts:[`Keep trying when things go wrong.`,`Paper kites are the best kites.`,`Never fly a kite near a bush.`],ans:0,proof:[3,4,6],
      hint:`Jada felt like giving up. What happened when she kept going?`,
      optHints:{2:`That could be good advice, but is it what the story is about? Think about what Jada did when she felt like giving up.`}}
  ],
  checks:[[
    {type:`mc`,p:`sandcastle`,q:`What was the problem in the story?`,opts:[`A wave knocked down two towers.`,`They did not have any shells.`,`The judges did not like the wall.`],ans:0,proof:[3,4],
      hint:`A problem is something that goes wrong. Find where something goes wrong.`},
    {type:`mc`,p:`sandcastle`,q:`How did Omar and Lina fix the problem?`,opts:[`They built a wall of sand to stop the waves.`,`They moved their castle away from the water.`,`They asked the judges for more time.`],ans:0,proof:[6,7],
      hint:`Find Omar's idea. What did they build?`},
    {type:`mc`,p:`sandcastle`,q:`Which part is NOT important to retell?`,opts:[`They added shells for windows.`,`A wave knocked down two towers.`,`They won a prize for their castle.`],ans:0,proof:[8],
      hint:SMALL,optHints:{1:`The wave is the problem, so it's a big part!`,2:`That's how the story ends, so it's a big part!`}},
    {type:`mc`,p:`sandcastle`,q:`Which is the BEST retelling of the story?`,opts:[
      `Omar and Lina built a sandcastle, but a wave knocked down two towers. They built a wall and fixed the towers. They won a prize.`,
      `Omar and Lina used shells for windows. They dug a deep ditch. Their castle had four tall towers, and the judges came to see it.`,
      `Omar and Lina won a prize. Then a wave knocked down two of their towers. Then they built a wall of sand and fixed their castle.`],ans:0,proof:[2,4,7,10],
      hint:`Does it tell the problem, the fix, and the ending, in order?`,
      optHints:{1:`That one has tiny details. Where is the problem, and how did it get fixed?`,2:`That one has the big events, but is the order right? When did they win the prize?`}},
    {type:`mc`,p:`sandcastle`,q:`What lesson does the story teach?`,opts:[`Don't give up when something goes wrong.`,`Always build castles far from the water.`,`Shells make the best castle windows.`],ans:0,proof:[5,11],
      hint:`Read what Lina says at the very end.`,
      optHints:{1:`That might be smart, but it isn't what the story teaches. What does Lina say at the end?`}}
  ],[
    {type:`mc`,p:`lemonade`,q:`What problem did Nia have at her stand?`,opts:[`Nobody stopped to buy lemonade.`,`She ran out of lemons and cups.`,`Her sign blew away in the wind.`],ans:0,proof:[3,4],
      hint:`Find the words "At first." What went wrong?`},
    {type:`mc`,p:`lemonade`,q:`How did Nia fix her problem?`,opts:[`She painted a big, bright sign.`,`She made her lemonade sweeter.`,`She moved her stand to the park.`],ans:0,proof:[7,8],
      hint:`Find Mr. Diaz's idea. What did Nia make?`},
    {type:`mc`,p:`lemonade`,q:`Which part is NOT important to retell?`,opts:[`Her sign had a yellow lemon on it.`,`Nobody stopped at her stand at first.`,`She bought the space book she wanted.`],ans:0,proof:[8],
      hint:SMALL,optHints:{1:`That's the problem, so it's a big part!`,2:`That's how the story ends, so it's a big part!`}},
    {type:`mc`,p:`lemonade`,q:`Which is the BEST retelling of the story?`,opts:[
      `Nia needed money for a book, so she sold lemonade. Nobody stopped until she made a bright sign. Then she sold lots and bought the book.`,
      `Nia's sign had a yellow lemon on it. Cars zoomed by her house. Mr. Diaz is her neighbor, and she sold twenty cups of lemonade.`,
      `Nia bought her new space book at the store. Then she painted a big, bright sign. Then she set up a stand, but nobody stopped.`],ans:0,proof:[2,3,8,11],
      hint:`Does it tell why Nia needed money, her problem, and how she fixed it, in order?`,
      optHints:{1:`Those are tiny details. It skips why Nia needed money and how she fixed her problem.`,2:`Those are big events, but the order is backwards. What did Nia do first?`}},
    {type:`mc`,p:`lemonade`,q:`What lesson does the story teach?`,opts:[`Don't give up, and listen to good advice.`,`Selling lemonade is always very easy.`,`It is always best to work by yourself.`],ans:0,proof:[5,6,9],
      hint:`Nia felt like giving up. What helped her?`,
      optHints:{1:`Look back. Was it easy at first?`,2:`Look back. Did Nia do it all by herself?`}}
  ]]
},
{
  id:`main-ideas`, title:`Main Ideas of Paragraphs`, mm:`Identify main ideas of paragraphs`,
  after:`Now go to MobyMax and do "Identify main ideas of paragraphs." For each paragraph, use the umbrella test.`,
  learnSay:`Every paragraph has a main idea. It is what all the sentences in that paragraph are about. The other sentences are helpers. They tell more. Dogs make great pets. They love to play. They keep you company. They can learn tricks. The main idea is: dogs make great pets. The other three sentences are helpers. The umbrella test: does the answer cover every sentence? If it fits only one sentence, it is a helper. The main idea is often the first sentence, but it can be at the end. Sometimes it is not written at all. Then put the helpers together to find it. When a text has many paragraphs, each paragraph has its own main idea.`,
  learn:`
    <p class="lead">Every paragraph has a <b>main idea</b>. It is what <i>all</i> the sentences in that paragraph are about. The other sentences are <b>helpers</b>. They tell more.</p>
    <div class="ex"><div class="ex-l">Example</div>
      <p><mark>Dogs make great pets.</mark> They love to play. They keep you company. They can learn tricks.</p>
      <p>Main idea: <b>Dogs make great pets.</b> The other three sentences are helpers.</p></div>
    <div class="tip"><b>The umbrella test:</b> Does the answer cover every sentence? If it fits only one sentence, it is a helper.</div>
    <p>The main idea is often the first sentence, but it can be at the end. Sometimes it is not written at all. Then put the helpers together to find it.</p>
    <p>When a text has many paragraphs, each paragraph has its own main idea.</p>`,
  guided:[
    {type:`tap`,p:`penguins`,q:`Tap the sentence that tells the main idea.`,ans:[0],proof:[0],
      hint:`That's a helper. It tells about just one thing. Find the sentence that covers them all.`},
    {type:`mc`,p:`recess`,q:`This paragraph has no main idea sentence. What is its main idea?`,opts:[`Kids do many things at recess.`,`Some kids jump rope by the fence.`,`Recess is the best part of the day.`],ans:0,proof:[0,1,2,3],
      hint:`Put the helpers together. What are ALL the sentences about?`,
      optHints:{1:HELPER,2:`The paragraph never says that. What are ALL the sentences about?`},
      why:`Racing, climbing, jumping rope, and tag all fit under one umbrella: kids do many things at recess.`},
    {type:`mc`,p:`frogs`,q:`What is the main idea of paragraph 1?`,opts:[`Frogs begin their lives in the water.`,`Tadpoles have long tails when they hatch.`,`A mother frog lays her eggs in a pond.`],ans:0,proof:[0],
      hint:`Which answer covers ALL the sentences in paragraph 1?`,optHints:{1:HELPER,2:HELPER}},
    {type:`tap`,p:`frogs`,q:`In paragraph 2, the main idea sentence is at the END. Tap it.`,ans:[7],proof:[7],
      hint:`That's a helper. Find the sentence that covers all of paragraph 2.`},
    {type:`mc`,p:`frogs`,q:`Which is the best title for paragraph 2?`,opts:[`From Tadpole to Frog`,`Hopping Onto the Land`,`All About Tadpole Tails`],ans:0,proof:[7],
      hint:`A good title covers the whole paragraph. What are ALL the sentences in paragraph 2 about?`,
      optHints:{1:TITLE_HELPER,2:TITLE_HELPER}}
  ],
  checks:[[
    {type:`mc`,p:`beavers`,q:`What is the main idea of paragraph 1?`,opts:[`Beavers are very good at building.`,`Beavers cut trees with their teeth.`,`A dam makes a quiet pond.`],ans:0,proof:[0],
      hint:`Which answer covers ALL the sentences in paragraph 1?`,optHints:{1:HELPER,2:HELPER}},
    {type:`mc`,p:`beavers`,q:`What is the main idea of paragraph 2?`,opts:[`Beavers have bodies made for swimming.`,`Beavers' back feet are webbed.`,`Beavers can stay underwater a long time.`],ans:0,proof:[4],
      hint:`Which answer covers ALL the sentences in paragraph 2?`,optHints:{1:HELPER,2:HELPER}},
    {type:`tap`,p:`beavers`,q:`Tap the main idea sentence of paragraph 3.`,ans:[8],proof:[8],
      hint:`That sentence is a helper, or it's in a different paragraph. Find the one that all of paragraph 3 tells about.`},
    {type:`mc`,p:`beavers`,q:`Which paragraph tells how beavers swim?`,opts:[`Paragraph 2`,`Paragraph 1`,`Paragraph 3`],ans:0,proof:[4],
      hint:`Look at the main idea of each paragraph.`},
    {type:`mc`,p:`beavers`,q:`What is the whole text mostly about?`,opts:[`How beavers build, swim, and live`,`How wolves find and hunt beavers`,`Why ponds are quiet places for animals`],ans:0,proof:[0,4,8],
      hint:`Put the main ideas of all three paragraphs together.`}
  ],[
    {type:`mc`,p:`camels`,q:`What is the main idea of paragraph 1?`,opts:[`Camels have bodies made for the desert.`,`Camels have thick eyelashes to block sand.`,`Camels can close their noses to keep out sand.`],ans:0,proof:[0],
      hint:`Which answer covers ALL the sentences in paragraph 1?`,optHints:{1:HELPER,2:HELPER}},
    {type:`tap`,p:`camels`,q:`Tap the main idea sentence of paragraph 2.`,ans:[4],proof:[4],
      hint:`That sentence is a helper, or it's in a different paragraph. Find the one that all of paragraph 2 tells about.`},
    {type:`mc`,p:`camels`,q:`Paragraph 3 has no main idea sentence. What is its main idea?`,opts:[`Camels help people in many ways.`,`Some families drink camel milk.`,`Camels can go a long time without water.`],ans:0,proof:[8,9,10],
      hint:`Put the helpers in paragraph 3 together. What are they all about?`,
      optHints:{1:HELPER,2:`That's the main idea of a different paragraph. Look at paragraph 3.`}},
    {type:`mc`,p:`camels`,q:`Which is the best title for the whole text?`,opts:[`All About Desert Camels`,`Blowing Sand in the Desert`,`How to Ride a Camel`],ans:0,proof:[0,4],
      hint:`A good title covers all three paragraphs.`,
      optHints:{1:`That fits only one sentence. A good title covers the whole text.`,2:`The text never tells how to ride a camel.`}},
    {type:`mc`,p:`camels`,q:`Which paragraph tells how camels keep sand out of their eyes and noses?`,opts:[`Paragraph 1`,`Paragraph 2`,`Paragraph 3`],ans:0,proof:[1,2],
      hint:`Look for the sentences about eyelashes and noses.`}
  ]]
},
{
  id:`details`, title:`Supporting Details`, mm:`Identify supporting details within paragraphs`,
  after:`Now go to MobyMax and do "Identify supporting details within paragraphs." For each sentence, use the belong test.`,
  learnSay:`Supporting details are the helper sentences. They tell more about the main idea. They can tell how, why, or give examples. Watch me. The main idea is: dogs make great pets. They love to play. Does it tell more about the main idea? Yes. They keep you company. Yes. My uncle has a red car. No. The belong test: does this sentence tell more about the main idea? If not, it is not a supporting detail. In a text with many paragraphs, a detail supports the main idea of its own paragraph.`,
  learn:`
    <p class="lead"><b>Supporting details</b> are the helper sentences. They tell more about the main idea. They can tell how, why, or give examples.</p>
    <div class="ex"><div class="ex-l">Watch me</div>
      <p>Main idea: <b>Dogs make great pets.</b></p>
      <div class="tf"><table>
        <thead><tr><th>Sentence</th><th>Tells more about the main idea?</th></tr></thead>
        <tbody>
          <tr><td>They love to play.</td><td class="yes">Yes</td></tr>
          <tr><td>They keep you company.</td><td class="yes">Yes</td></tr>
          <tr><td>My uncle has a red car.</td><td class="nope">No</td></tr>
        </tbody></table></div></div>
    <div class="tip"><b>The belong test:</b> Does this sentence tell more about the main idea? If not, it is not a supporting detail.</div>
    <p>In a text with many paragraphs, a detail supports the main idea of <b>its own</b> paragraph.</p>`,
  guided:[
    {type:`tap`,p:`penguins`,q:`The main idea is "Penguins are built for cold water." Tap a detail that tells how penguins stay warm.`,ans:[1,2],proof:[1,2],
      near:{0:`That's the main idea sentence! Find a helper that tells HOW they stay warm.`},
      hint:`That helper is about swimming. Find one about staying warm.`},
    {type:`mc`,p:`classgarden`,q:`The main idea is "Our class garden needs a lot of care." Which sentence does NOT support it?`,opts:[`My friend Ben has a new red bike.`,`Every morning, we water the plants.`,`On Fridays, we pull out the weeds.`],ans:0,proof:[3],
      hint:`Use the belong test. Which sentence is NOT about caring for the garden?`,
      optHints:{1:`Watering is caring for the garden, so it belongs.`,2:`Pulling weeds is caring for the garden, so it belongs.`},
      why:`It's about a bike, not about caring for the garden, so it doesn't belong.`},
    {type:`tap`,p:`classgarden`,q:`Tap a detail that tells how the class keeps birds away.`,ans:[4],proof:[4],
      hint:`That detail is about the garden, but is it about birds?`},
    {type:`mc`,p:`owls`,q:`Which detail supports the main idea of paragraph 1?`,opts:[`They can spot a mouse from far away.`,`They can hear a mouse moving under the snow.`,`Some owls have one ear higher than the other.`],ans:0,proof:[2],
      hint:`Paragraph 1 is about owls' eyes. Which detail is about seeing?`,
      optHints:{1:`That's a helper, but it belongs to paragraph 2, which is about ears.`,2:`That's a helper, but it belongs to paragraph 2, which is about ears.`}},
    {type:`tap`,p:`owls`,q:`Tap a detail in paragraph 2 that tells more about owls' ears.`,ans:[5,6,7],proof:[5,6,7],
      near:{4:`That's the main idea sentence of paragraph 2. Find a helper that tells more.`},
      hint:`That sentence is about eyes. Look in paragraph 2.`},
    {type:`mc`,p:`owls`,q:`Which new sentence would belong in paragraph 2?`,opts:[`Owls' round faces help catch sounds.`,`Owls lay their eggs inside old trees.`,`Many owls have brown and white feathers.`],ans:0,proof:[4],
      hint:`Paragraph 2 is about ears. Which sentence tells more about hearing?`,
      optHints:{1:`That's true about owls, but is it about their ears?`,2:`That's true about owls, but is it about their ears?`}}
  ],
  checks:[[
    {type:`mc`,p:`hummingbirds`,q:`Which detail supports the idea that hummingbirds are very small?`,opts:[`A few weigh less than a penny.`,`They can even fly backward!`,`They visit hundreds of flowers every day.`],ans:0,proof:[1,2],
      hint:`Look in paragraph 1. Which detail shows how SMALL they are?`},
    {type:`tap`,p:`hummingbirds`,q:`Tap a detail that shows hummingbirds are fast.`,ans:[4,5],proof:[4,5],
      near:{3:`That's the main idea sentence of paragraph 2. Find a helper that SHOWS they are fast.`},
      hint:`That sentence is true, but does it show that hummingbirds are fast?`},
    {type:`mc`,p:`hummingbirds`,q:`Which sentence does NOT belong in paragraph 2?`,opts:[`Many birds build their nests in trees.`,`They can even fly backward!`,`Their wings can flap more than fifty times a second.`],ans:0,proof:[6],
      hint:`Paragraph 2 is about how fast hummingbirds are. Which sentence is not about that?`,
      optHints:{1:`Flying backward is about how they fly, so it belongs.`,2:`Fast wings show how fast they are, so it belongs.`},
      why:`Nests aren't about being fast, so that sentence doesn't belong.`},
    {type:`mc`,p:`hummingbirds`,q:`Paragraph 3 is about how hummingbirds get energy. Which detail supports it?`,opts:[`Their long, thin beaks reach deep inside the flowers.`,`Some of them are about as long as your thumb.`,`Their wings can flap more than fifty times a second.`],ans:0,proof:[8,9],
      hint:`Look in paragraph 3. Which detail is about getting nectar?`},
    {type:`mc`,p:`hummingbirds`,q:`Which paragraph would this new detail fit in? "Their eggs are about the size of a jelly bean."`,opts:[`Paragraph 1, about how small they are`,`Paragraph 2, about how fast they are`,`Paragraph 3, about how they get energy`],ans:0,proof:[0],
      hint:`Think about what a jelly bean tells you about the eggs. Which paragraph is about that?`}
  ],[
    {type:`mc`,p:`turtles`,q:`Which detail supports the idea that sea turtles live in the ocean?`,opts:[`Some swim thousands of miles across the sea.`,`She digs a hole in the sand and lays her eggs inside.`,`They dig their way out of the sand.`],ans:0,proof:[1,2,3],
      hint:`Look in paragraph 1. Which detail is about the ocean?`},
    {type:`mc`,p:`turtles`,q:`Which sentence does NOT belong in paragraph 2?`,opts:[`Seagulls often fly over the beach looking for fish.`,`A mother turtle crawls onto a beach at night.`,`She digs a hole in the sand and lays her eggs inside.`],ans:0,proof:[7],
      hint:`Paragraph 2 is about turtles laying eggs. Which sentence is not about that?`,
      optHints:{1:`That's part of how she lays her eggs, so it belongs.`,2:`That's how she lays her eggs, so it belongs.`},
      why:`Seagulls looking for fish have nothing to do with laying eggs, so that sentence doesn't belong.`},
    {type:`tap`,p:`turtles`,q:`Tap a detail that tells what baby turtles do after they hatch.`,ans:[9,10],proof:[9,10],
      near:{8:`That tells WHEN they hatch. Find what they DO after.`},
      hint:`That sentence is true, but is it about what the babies do? Look in paragraph 3.`},
    {type:`mc`,p:`turtles`,q:`Paragraph 2 is about coming to land to lay eggs. Which detail supports it?`,opts:[`A mother turtle crawls onto a beach at night.`,`They can hold their breath for a long time.`,`Then they race down the beach to the water.`],ans:0,proof:[5,6],
      hint:`Which detail is about the mother turtle coming to land?`,
      optHints:{1:`That's about living in the ocean, from paragraph 1.`,2:`That's about the babies, from paragraph 3.`}},
    {type:`mc`,p:`turtles`,q:`Which paragraph would this new detail fit in? "Each nest can hold about one hundred eggs."`,opts:[`Paragraph 2, about laying eggs`,`Paragraph 1, about living in the ocean`,`Paragraph 3, about babies hatching`],ans:0,proof:[6],
      hint:`What is a nest for? Which paragraph is about that?`}
  ]]
},
{
  id:`recount-info`, title:`Recount a Fact Text`, mm:`Recount informational text`,
  after:`Now go to MobyMax and do "Recount informational text." Tell the big ideas in order and skip tiny details.`,
  learnSay:`To recount a fact text, tell the most important ideas in your own words, in order. Topic: what is the whole text about? Big ideas: what are the most important facts or steps? Order: tell them in the same order as the text. Watch me. Rain comes from clouds. First, the sun warms water in lakes and oceans. The water turns into a gas and rises into the air. High up, it cools and makes clouds. Some clouds look like animals. When the drops in a cloud get heavy, they fall as rain. Recount: The sun warms water, and it rises into the air. It cools and makes clouds. When the drops get heavy, they fall as rain. Some clouds look like animals is a tiny detail, so it stays out. Skip tiny details. A good recount is short and tells only the big ideas.`,
  learn:`
    <p class="lead">To <b>recount</b> a fact text, tell the most important ideas in your own words, in order.</p>
    <ol class="habits">
      <li><span><b>Topic:</b> What is the whole text about?</span></li>
      <li><span><b>Big ideas:</b> What are the most important facts or steps?</span></li>
      <li><span><b>Order:</b> Tell them in the same order as the text.</span></li>
    </ol>
    <div class="ex"><div class="ex-l">Watch me</div>
      <p>Rain comes from clouds. First, the sun warms water in lakes and oceans. The water turns into a gas and rises into the air. High up, it cools and makes clouds. Some clouds look like animals. When the drops in a cloud get heavy, they fall as rain.</p>
      <p><b>Recount:</b> The sun warms water, and it rises into the air. It cools and makes clouds. When the drops get heavy, they fall as rain.</p>
      <p>"Some clouds look like animals" is a tiny detail, so it stays out.</p></div>
    <div class="tip"><b>Skip tiny details.</b> A good recount is short and tells only the big ideas.</div>`,
  guided:[
    {type:`mc`,p:`honey`,q:`What is this text mostly about?`,opts:[`How bees make honey`,`Why flowers smell sweet`,`How to build a beehive`],ans:0,proof:[0,7],
      hint:`Look at the title and the first sentence. What are ALL the sentences about?`},
    {type:`order`,p:`honey`,q:`Put the steps in order.`,items:[`A bee drinks nectar from flowers.`,`The bee gives the nectar to a bee in the hive.`,`The bees fan the nectar to dry it.`,`The bees cover the cells with wax lids.`],proof:[1,3,5,6],
      hint:`Find the order words: First, Next, Then, Finally.`},
    {type:`mc`,p:`honey`,q:`What happens right after the bee flies back to the hive?`,opts:[`It passes the nectar to another bee.`,`It covers each cell with a wax lid.`,`It goes back to visit more flowers.`],ans:0,proof:[3],point:true,
      hint:`Find the sentence about flying back to the hive. Read the very next sentence.`},
    {type:`mc`,p:`honey`,q:`Which detail is NOT important to retell?`,opts:[`Honey can stay good for a very long time.`,`Bees fan the nectar with their wings until it gets thick.`,`Bees drink sweet nectar from many flowers.`],ans:0,proof:[7],
      hint:`Which one is a fun fact, not a step in making honey?`,
      optHints:{1:`That's a step in making honey, so it's important.`,2:`That's the first step, so it's important.`}},
    {type:`mc`,p:`honey`,q:`Which is the BEST recount of this text?`,opts:[
      `Bees drink nectar and bring it to the hive. They put it in wax cells, fan it until it is thick, and cover it with wax lids.`,
      `Bees have wings and a special honey stomach. Honey is thick, sticky, and sweet. It can stay good for a very long time.`,
      `Bees cover the cells with wax lids. Then they fan the nectar with their wings. Then they drink nectar from flowers.`],ans:0,proof:[1,3,5,6],
      hint:`A good recount tells the big steps, in order.`,
      optHints:{1:`Those are true facts, but they don't tell how honey is made, step by step.`,2:`Those are the right steps, but the order is backwards. What happens first?`}}
  ],
  checks:[[
    {type:`mc`,p:`butterfly`,q:`What is this text mostly about?`,opts:[`How a butterfly grows`,`How caterpillars find food`,`Why butterflies like flowers`],ans:0,proof:[0],
      hint:`Look at the first sentence. What are ALL the paragraphs about?`},
    {type:`order`,p:`butterfly`,q:`Put the stages in order.`,items:[`A butterfly lays an egg.`,`A caterpillar hatches and eats.`,`It makes a chrysalis.`,`A butterfly comes out.`],proof:[1,2,5,7],
      hint:`Find the order words: First, Next, Then, Finally.`},
    {type:`mc`,p:`butterfly`,q:`Which detail is NOT important to retell?`,opts:[`Some caterpillars have bright stripes.`,`A caterpillar hatches from the egg.`,`A butterfly comes out of the chrysalis.`],ans:0,proof:[4],
      hint:`Which one is a tiny detail, not one of the stages?`,

/* ---------- state ---------- */
const KEY = `lucy-reading-detective-v1`;
let prog = {};
try { prog = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { prog = {}; }
if (!prog.tries) prog.tries = {};
function save(){ try { localStorage.setItem(KEY, JSON.stringify(prog)); } catch (e) {} }

let S = { view:`home` };
const app = document.getElementById(`app`);
const canSpeak = `speechSynthesis` in window;

function speak(text){
  if (!canSpeak) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 0.88; speechSynthesis.speak(u); } catch (e) {}
}
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function shuffleMC(q){
  if (q.type !== `mc`) return q;
  const order = shuffle(q.opts.map((_, i) => i));
  const optHints = {};
  if (q.optHints) order.forEach((orig, i) => { if (q.optHints[orig]) optHints[i] = q.optHints[orig]; });
  return { ...q, opts: order.map(i => q.opts[i]), ans: order.indexOf(q.ans), optHints };
}
const esc = s => String(s).replace(/&/g,`&amp;`).replace(/</g,`&lt;`).replace(/>/g,`&gt;`);
const attr = s => esc(s).replace(/"/g,`&quot;`);
const plain = html => html.replace(/<[^>]+>/g, ` `).replace(/\s+/g, ` `).trim();

const STAR = on => `<svg viewBox="0 0 24 24" aria-hidden="true"><path class="${on ? `star-on` : `star-off`}" d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>`;
const stars = (n, cls = `stars`) => `<span class="${cls}" aria-label="${n} of 3 stars">${STAR(n>=1)}${STAR(n>=2)}${STAR(n>=3)}</span>`;
const SPEAKER = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M4 9h4l5-4v14l-5-4H4z"/></svg>`;
const MAG = `<svg class="mag" viewBox="0 0 64 64" aria-hidden="true"><circle cx="26" cy="26" r="17" fill="var(--hl)" stroke="var(--ink)" stroke-width="5"/><path d="M38.5 38.5 56 56" stroke="var(--ink)" stroke-width="8" stroke-linecap="round"/><path d="M17 22a10 10 0 0 1 8-7" stroke="var(--paper)" stroke-width="4" stroke-linecap="round" fill="none"/></svg>`;
const listenBtn = text => canSpeak ? `<button class="listen" data-act="say" data-text="${attr(text)}">${SPEAKER}Listen</button>` : ``;

/* ---------- views ---------- */
function renderHome(){
  const rows = LESSONS.map((l, i) => {
    const st = prog[l.id] || 0;
    return `<li><button class="case ${st ? `solved` : ``}" data-act="open" data-i="${i}">
      <span class="n">${i+1}</span>
      <span><span class="t">${l.title}</span><br><span class="sk">Then in MobyMax: ${esc(l.mm)}</span></span>
      ${stars(st)}
    </button></li>`;
  }).join(``);
  app.innerHTML = `
    <header class="top">${MAG}<div><h1>Lucy's Reading Detective</h1>
      <p>Five practice lessons. Each one matches a lesson in MobyMax Reading. Practice here first, then go do the same lesson in MobyMax.</p></div></header>
    <ol class="trail">${rows}</ol>`;
}

function lessonBar(){
  const l = LESSONS[S.li], ph = [`learn`,`guided`,`check`];
  const idx = S.phase === `ready` ? 2 : S.phase === `result` ? 3 : ph.indexOf(S.phase);
  const labels = [`Learn the trick`,`Practice together`,`Check`];
  return `<div class="bar"><button class="back" data-act="home">← All lessons</button>
    <div class="steps">${labels.map((t, i) => `<span class="${i === idx ? `on` : i < idx ? `past` : ``}">${t}</span>`).join(``)}</div></div>
    <div class="lhead"><h2>Lesson ${S.li+1}: ${l.title}</h2><p class="sk">MobyMax lesson: ${esc(l.mm)}</p></div>`;
}

function renderLearn(){
  const l = LESSONS[S.li];
  app.innerHTML = lessonBar() + `<div class="card learn pop"><div class="lrow">${listenBtn(l.learnSay)}</div>${l.learn}
    <div class="go"><button class="btn" data-act="toGuided">Let's practice</button></div></div>`;
}

function renderReady(){
  app.innerHTML = lessonBar() + `<div class="card center pop">
    <h3>Check: 5 questions</h3>
    <p class="stat">Remember: <b>peek</b> at the question, <b>read</b>, then <b>point</b> to the proof with your finger.</p>
    <p>Now try a new passage on your own. Get 4 right on the first try to pass.</p>
    <button class="btn" data-act="startCheck">Start the check</button></div>`;
}

function passageHTML(P, q){
  let n = 0;
  const hl = new Set(S.done ? q.proof || [] : []);
  const tappable = !S.done && (q.type === `tap` || S.pointing);
  const numbered = P.paras.length > 1;
  const paras = P.paras.map((para, pi) => `<p>${numbered ? `<span class="pn" aria-label="Paragraph ${pi+1}">${pi+1}</span>` : ``}${para.map(s => {
    const i = n++;
    const cls = [`s`];
    let live = false;
    if (hl.has(i) || (S.found && S.found.includes(i))) cls.push(`hl`);
    else if (S.tapWrong.has(i)) cls.push(`no`);
    else if (S.tapNear.has(i)) cls.push(`near`);
    else if (tappable) { cls.push(i === S.sel ? `sel` : `tap`); live = true; }
    const attrs = live ? ` role="button" tabindex="0" aria-pressed="${i === S.sel}" data-act="tapS" data-s="${i}"` : ``;
    return `<span class="${cls.join(` `)}"${attrs}>${esc(s)}</span>`;
  }).join(` `)}</p>`).join(``);
  const audio = S.phase === `check` ? `` : listenBtn(P.title + `. ` + P.paras.flat().join(` `));
  const confirm = tappable && S.sel !== null
    ? `<div class="confirm"><button class="btn" data-act="confirmS">This is my proof</button><span class="sk">or tap a different sentence</span></div>` : ``;
  return `<section class="passage"><div class="phead"><h3>${P.title}</h3>${audio}</div>
    <div class="ptext">${paras}</div>${confirm}</section>`;
}

function currentList(){ return S.phase === `guided` ? S.guidedQs : S.checkQs; }

function renderQuestion(){
  const list = currentList();
  const q = list[S.qi], P = PASSAGES[q.p];
  const meta = S.phase === `guided`
    ? `<div class="qmeta"><span>Practice together · ${S.qi+1} of ${list.length}</span></div>`
    : `<div class="qmeta"><span>Question ${S.qi+1} of ${list.length}</span><span class="dots">${list.map((_, i) =>
        `<i class="${i < S.qi ? (S.marks[i] ? `ok` : `miss`) : i === S.qi ? `cur` : ``}"></i>`).join(``)}</span></div>`;

  const qtext = q.concl
    ? `<div class="qtext">${esc(q.ask)}<span class="concl">Conclusion: ${esc(q.q)}</span></div>`
    : `<div class="qtext">${esc(q.q)}${q.ask ? `<br>${esc(q.ask)}` : ``}</div>`;
  const extra = q.opts ? q.opts : q.items ? q.items : [];
  const sayText = (q.concl ? q.ask + ` Conclusion: ` + q.q : q.q + (q.ask ? ` ` + q.ask : ``)) + (extra.length ? ` ` + extra.join(`. `) : ``);

  let body = ``;
  if (q.type === `mc`) {
    const waiting = S.pointing;
    body = `${waiting ? `<p class="step">Step 1: Find your proof in the story. Step 2: Choose.</p>` : ``}
      <div class="opts ${waiting ? `wait` : ``}">${q.opts.map((o, i) => {
      const cls = S.answered && i === q.ans ? `right` : S.wrongOpts.has(i) ? `wrong` : ``;
      const dis = waiting || S.answered || S.wrongOpts.has(i) ? `disabled` : ``;
      return `<button class="opt ${cls}" data-act="opt" data-o="${i}" ${dis}>${esc(o)}</button>`;
    }).join(``)}</div>`;
  } else if (q.type === `tap`) {
    body = S.done ? `` : `<p class="sk">Tap a sentence in the story, then tap "This is my proof."</p>`;
  } else if (q.type === `order`) {
    const picked = S.picked, full = picked.length === q.items.length;
    body = `<div class="slots">${q.items.map((_, k) => {
      const it = picked[k];
      return `<div class="slot ${it !== undefined ? (S.done ? `right` : `full`) : ``}">${it !== undefined ? esc(q.items[it]) : ``}</div>`;
    }).join(``)}</div>
    ${S.done || (full && S.orderWrong) ? `` : `<div class="chips">${S.shuf.map(it =>
      `<button class="chip" data-act="chip" data-c="${it}" ${picked.includes(it) ? `disabled` : ``}>${esc(q.items[it])}</button>`).join(``)}</div>`}
    ${S.orderWrong && !S.done ? `<button class="btn ghost small" data-act="orderRetry">Try the order again</button>` : ``}`;
  }

  const fb = S.fb ? `<div class="fb ${S.fb.kind} pop"><div>${S.fb.html}</div>${listenBtn(plain(S.fb.html))}</div>` : ``;
  const next = S.done ? `<button class="btn" data-act="next">${S.qi + 1 < list.length ? `Next` : S.phase === `guided` ? `On to the check` : `See my score`}</button>` : ``;

  app.innerHTML = lessonBar() + `<div class="qa">
    <section class="question" aria-live="polite">${meta}
      <div class="phead">${qtext}${listenBtn(sayText)}</div>
      ${body}${fb}${next}</section>
    ${passageHTML(P, q)}</div>`;
}

function renderResult(){
  const l = LESSONS[S.li], sc = S.score, pass = sc >= 4;
  const st = sc === 5 ? 3 : sc === 4 ? 2 : 0;
  const secs = Math.round((Date.now() - S.t0) / 1000);
  const time = `${Math.floor(secs / 60)} min ${secs % 60} sec`;
  const tries = prog.tries[l.id] || 0;
  const withGuide = tries >= l.checks.length;
  app.innerHTML = lessonBar() + `<div class="card center pop">
    ${pass ? `<h3>You passed!</h3>${stars(st, `big-stars`)}` : `<h3>${sc >= 3 ? `So close!` : `Let's look at the clues again.`}</h3>`}
    <p class="stat">You got <span class="num">${sc} of 5</span> on the first try, in <span class="num">${time}</span>.</p>
    ${pass
      ? `<p class="mm">${esc(l.after)}</p>
         <div class="go"><button class="btn ghost" data-act="home">All lessons</button></div>`
      : `<p>You need 4 to pass. ${withGuide ? `Ask your guide to sit with you for the next check.` : `The next check has a new story.`}</p>
         <div class="go"><button class="btn" data-act="startCheck">Try a new check</button>
         <button class="btn ghost" data-act="toLearn">Review the trick</button></div>`}
  </div>`;
}

function render(){
  if (S.view === `home`) return renderHome();
  if (S.phase === `learn`) return renderLearn();
  if (S.phase === `ready`) return renderReady();
  if (S.phase === `result`) return renderResult();
  return renderQuestion();
}

/* ---------- flow ---------- */
function currentQ(){
  if (S.phase === `guided` || S.phase === `check`) return currentList()[S.qi];
  return null;
}
function resetQ(){
  const q = currentQ();
  S.answered = false; S.done = false; S.first = true; S.found = null; S.sel = null;
  S.pointing = !!(q && S.phase === `guided` && q.point);
  S.wrongOpts = new Set(); S.tapWrong = new Set(); S.tapNear = new Set(); S.picked = []; S.orderWrong = false;
  S.fb = S.pointing ? { kind:`info`, html:`<b>Point first!</b> Tap the sentence in the story that answers the question.` } : null;
  if (q && q.type === `order`) { let sh; do { sh = shuffle(q.items.map((_, i) => i)); } while (sh.every((v, i) => v === i)); S.shuf = sh; }
}
function finishQ(msg){
  S.done = true; S.pointing = false; S.sel = null;
  if (S.phase === `check`) { S.marks[S.qi] = S.first; if (S.first) S.score++; }
  S.fb = { kind:`good`, html: msg };
}
const PRAISE = [`Yes!`,`You got it!`,`Great detective work!`,`Correct!`];
const praise = () => `<b>${PRAISE[Math.floor(Math.random() * PRAISE.length)]}</b>`;

function onOpt(i){
  const q = currentQ();
  if (S.pointing) return;
  if (i === q.ans) {
    S.answered = true;
    finishQ(`${praise()} ${q.why ? esc(q.why) : `The yellow part of the story is the proof.`}`);
  } else {
    S.first = false; S.wrongOpts.add(i);
    S.fb = { kind:`oops`, html:`<b>Not quite.</b> ${esc((q.optHints && q.optHints[i]) || q.hint)}` };
  }
  render();
}
function onConfirm(){
  const q = currentQ(), i = S.sel;
  if (i === null) return;
  S.sel = null;
  if (S.pointing) {
    if (q.proof.includes(i)) {
      S.pointing = false; S.found = [i];
      S.fb = { kind:`good`, html:`<b>That's your proof!</b> Now choose the answer.` };
    } else {
      S.tapWrong.add(i);
      S.fb = { kind:`oops`, html:`<b>Look again.</b> That sentence is in the story, but does it answer the question? ${esc(q.hint)}` };
    }
  } else if (q.ans.includes(i)) {
    S.found = [i];
    finishQ(`${praise()} That sentence proves it.`);
  } else if (q.near && q.near[i]) {
    S.first = false; S.tapNear.add(i);
    S.fb = { kind:`info`, html:`<b>Close!</b> ${esc(q.near[i])}` };
  } else {
    S.first = false; S.tapWrong.add(i);
    S.fb = { kind:`oops`, html:`<b>Look again.</b> ${esc(q.hint)}` };
  }
  render();
}
function onChip(c){
  const q = currentQ();
  S.picked.push(c);
  if (S.picked.length === q.items.length) {
    if (S.picked.every((v, k) => v === k)) finishQ(`${praise()} That's the right order. The yellow sentences show each step.`);
    else { S.first = false; S.orderWrong = true; S.fb = { kind:`oops`, html:`<b>Not quite.</b> ${esc(q.hint)}` }; }
  }
  render();
}

app.addEventListener(`click`, e => {
  const t = e.target.closest(`[data-act]`); if (!t) return;
  const a = t.dataset.act;
  if (a === `open`) { S = { view:`lesson`, li:+t.dataset.i, phase:`learn` }; window.scrollTo(0,0); }
  else if (a === `home`) { S = { view:`home` }; }
  else if (a === `toLearn`) { S.phase = `learn`; }
  else if (a === `toGuided`) { S.phase = `guided`; S.qi = 0; S.guidedQs = LESSONS[S.li].guided.map(shuffleMC); resetQ(); }
  else if (a === `startCheck`) {
    const l = LESSONS[S.li];
    const n = prog.tries[l.id] || 0;
    prog.tries[l.id] = n + 1; save();
    S.phase = `check`; S.qi = 0; S.score = 0; S.marks = []; S.t0 = Date.now();
    S.checkQs = l.checks[n % l.checks.length].map(shuffleMC); resetQ();
  }
  else if (a === `opt`) return onOpt(+t.dataset.o);
  else if (a === `tapS`) { S.sel = +t.dataset.s; }
  else if (a === `confirmS`) return onConfirm();
  else if (a === `chip`) return onChip(+t.dataset.c);
  else if (a === `orderRetry`) { S.picked = []; S.orderWrong = false; S.fb = null; }
  else if (a === `say`) { speak(t.dataset.text); return; }
  else if (a === `next`) {
    const list = currentList();
    if (S.qi + 1 < list.length) { S.qi++; resetQ(); }
    else if (S.phase === `guided`) { S.phase = `ready`; }
    else {
      S.phase = `result`;
      const st = S.score === 5 ? 3 : S.score === 4 ? 2 : 0;
      const id = LESSONS[S.li].id;
      if (st > (prog[id] || 0)) { prog[id] = st; save(); }
    }
    window.scrollTo(0,0);
  }
  render();
});
app.addEventListener(`keydown`, e => {
  if ((e.key === `Enter` || e.key === ` `) && e.target.matches(`[data-act="tapS"]`)) {
    e.preventDefault(); S.sel = +e.target.dataset.s; render();
    const btn = app.querySelector(`[data-act="confirmS"]`); if (btn) btn.focus();
  }
});

render();
</script>

</html>
