<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Lucy's Reading Detective</title>
<style>
:root{
  --ground:#F1F6FB; --paper:#FFFFFF; --ink:#1D2B45; --muted:#56678A; --line:#D5DFEC;
  --accent:#2F6FD6; --accent-ink:#FFFFFF; --accent-soft:#E3EDFC;
  --hl:#FFE45C; --hl-ink:#1D2B45; --near:#C99A00;
  --good:#17895C; --good-soft:#DDF4EA; --oops:#C9502D; --oops-soft:#FCE6DE;
  --lock:#A9B6CB;
  --shadow:0 2px 0 #D5DFEC;
  --display:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --read:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0F1726; --paper:#172238; --ink:#EAF0FA; --muted:#9FB0CC; --line:#2A3A57;
    --accent:#7FA8F5; --accent-ink:#0F1726; --accent-soft:#1F3150; --near:#FFD84D;
    --good:#3CC48D; --good-soft:#15352B; --oops:#FF8A66; --oops-soft:#3A2119;
    --lock:#4A5B78; --shadow:0 2px 0 #0A101C;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0F1726; --paper:#172238; --ink:#EAF0FA; --muted:#9FB0CC; --line:#2A3A57;
  --accent:#7FA8F5; --accent-ink:#0F1726; --accent-soft:#1F3150; --near:#FFD84D;
  --good:#3CC48D; --good-soft:#15352B; --oops:#FF8A66; --oops-soft:#3A2119;
  --lock:#4A5B78; --shadow:0 2px 0 #0A101C;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--read);font-size:18px;line-height:1.55}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,6vw,44px);font-weight:700}
h2{font-size:clamp(24px,4.5vw,32px);font-weight:700}
h3{font-size:20px;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
mark{background:var(--hl);color:var(--hl-ink);border-radius:4px;padding:0 3px}

/* home */
.top{display:flex;gap:16px;align-items:center;margin-block:8px 20px}
.mag{flex:none;width:64px;height:64px}
.top p{color:var(--muted);max-width:60ch;margin-top:6px}
.trail{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.case{width:100%;display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;text-align:left;
  background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow)}
.case:hover:not([disabled]){border-color:var(--accent)}
.case[disabled]{cursor:not-allowed;opacity:.62}
.case .n{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:24px;
  background:var(--accent-soft);color:var(--accent)}
.case.solved .n{background:var(--good-soft);color:var(--good)}
.case[disabled] .n{background:transparent;border:2px dashed var(--lock);color:var(--lock)}
.case .t{font-family:var(--display);font-weight:700;font-size:21px}
.stars{display:flex;gap:2px}
.stars svg{width:24px;height:24px}
.star-on{fill:#F5B400}
.star-off{fill:none;stroke:var(--lock);stroke-width:1.6}

.num{font-variant-numeric:tabular-nums;white-space:nowrap}

/* buttons */
.btn{min-height:52px;padding:10px 22px;border-radius:999px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);
  font-family:var(--display);font-weight:700;font-size:19px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{min-height:40px;font-size:15px;padding:6px 16px}
.btn:hover{filter:brightness(1.06)}

/* lesson frame */
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.back{background:none;border:none;color:var(--accent);font-family:var(--display);font-weight:700;font-size:17px;cursor:pointer;padding:6px 0}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:14px;padding:4px 12px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted)}
.steps span.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.steps span.past{border-color:var(--good);color:var(--good)}
.lhead{margin-bottom:18px}
.sk{color:var(--muted);font-size:15px}
.lhead .sk{margin-top:4px}

.card{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:22px}
.learn{display:grid;gap:16px;max-width:720px;font-size:20px}
.learn .lead{font-size:22px}
.lrow{display:flex;justify-content:flex-end}
.habits{margin:0;padding-left:0;list-style:none;display:grid;gap:10px;counter-reset:h}
.habits li{counter-increment:h;display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.habits li::before{content:counter(h);width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-family:var(--display);font-weight:700}
.ex{border:2px dashed var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.ex-l{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tf{overflow-x:auto}
.tf table{border-collapse:collapse;width:100%;min-width:420px;font-size:18px}
.tf th,.tf td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.tf th{font-size:14px;color:var(--muted);font-weight:700}
.yes{color:var(--good);font-weight:700}
.nope{color:var(--oops);font-weight:700}
.tip{background:var(--accent-soft);border-radius:14px;padding:14px 16px}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.duo > div{border:2px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:4px}
.duo .w{color:var(--muted);font-size:17px}
.go{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}

/* question layout */
.qa{display:grid;grid-template-columns:1.1fr 1fr;grid-template-areas:"passage question";gap:18px;align-items:start}
.qa .passage{grid-area:passage}
.qa .question{grid-area:question;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:780px){
  .qa{grid-template-columns:1fr;grid-template-areas:"question" "passage"}
  .qa .question{position:static}
}
.passage{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:20px 22px;display:grid;gap:12px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ptext{font-size:22px;line-height:1.75;display:grid;gap:14px}
.pn{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);
  font-family:var(--display);font-size:14px;color:var(--muted);margin-right:6px;vertical-align:3px}
.s{border-radius:6px;padding:1px 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background .2s}
.s.tap{cursor:pointer;background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--accent)}
.s.tap:hover{background:color-mix(in srgb,var(--hl) 55%,transparent);color:inherit}
.s.sel{background:color-mix(in srgb,var(--hl) 70%,transparent);color:var(--hl-ink);outline:3px solid var(--accent);outline-offset:1px}
.s.hl{background:var(--hl);color:var(--hl-ink);box-shadow:none}
.s.near{background:color-mix(in srgb,var(--hl) 30%,transparent);box-shadow:inset 0 -2px 0 var(--near);cursor:default}
.s.no{background:var(--oops-soft);box-shadow:inset 0 -2px 0 var(--oops);cursor:default}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
  background:var(--paper);border:2px solid var(--accent);border-radius:16px;padding:10px 12px}
.listen{display:inline-flex;align-items:center;gap:6px;background:none;border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;
  font-size:14px;color:var(--muted);cursor:pointer;flex:none}
.listen svg{width:16px;height:16px;fill:currentColor}
.listen:hover{border-color:var(--accent);color:var(--accent)}

.question{background:var(--paper);border:2px solid var(--accent);border-radius:20px;padding:20px 22px;display:grid;gap:14px}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.03em}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.dots i.cur{border-color:var(--accent)}
.dots i.ok{background:var(--good);border-color:var(--good)}
.dots i.miss{background:var(--oops);border-color:var(--oops)}
.qtext{font-size:22px;font-weight:700;line-height:1.4}
.qtext .concl{display:block;margin-top:6px;font-weight:400;background:var(--accent-soft);border-radius:10px;padding:8px 12px}
.step{font-size:16px;font-weight:700;color:var(--accent)}
.opts{display:grid;gap:10px}
.opts.wait{opacity:.45}
.opt{text-align:left;min-height:56px;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--paper);cursor:pointer;font-size:19px;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--oops);background:var(--oops-soft);text-decoration:line-through;text-decoration-color:var(--oops)}
.chips{display:grid;gap:8px}
.chip{text-align:left;min-height:52px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--paper);cursor:pointer;font-size:18px}
.chip:hover:not([disabled]){border-color:var(--accent)}
.chip[disabled]{opacity:.35;cursor:default}
.slots{display:grid;gap:8px;counter-reset:sl}
.slot{counter-increment:sl;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;min-height:48px;padding:6px 12px;border-radius:12px;border:2px dashed var(--line);font-size:18px}
.slot::before{content:counter(sl);width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:16px}
.slot.full{border-style:solid;border-color:var(--accent)}
.slot.right{border-color:var(--good);background:var(--good-soft)}
.fb{border-radius:14px;padding:12px 14px;font-size:18px;display:grid;gap:8px}
.fb .listen{justify-self:start}
.fb.good{background:var(--good-soft);color:var(--ink);border:2px solid var(--good)}
.fb.oops{background:var(--oops-soft);color:var(--ink);border:2px solid var(--oops)}
.fb.info{background:var(--hl);color:var(--hl-ink)}
.fb.info .listen{color:var(--hl-ink);border-color:color-mix(in srgb,var(--hl-ink) 30%,transparent)}
.fb b{font-family:var(--display)}

.center{display:grid;gap:16px;justify-items:start;max-width:640px}
.big-stars{display:flex;gap:6px}
.big-stars svg{width:48px;height:48px}
.stat{font-size:20px}
.stat .num{font-weight:700}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .35s ease-out}
  @keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
}
</style>

<div class="wrap" id="app"></div>

<script>
/* Sentence indices are global across a passage's paragraphs, starting at 0. */
const PASSAGES = {
  /* case 1 */
  mitten:{title:`The Lost Mitten`,paras:[[
    `Maya had one red mitten on her left hand.`,
    `Her right hand was cold and pink.`,
    `"I must have dropped it on the way to the bus," she said.`,
    `She walked back along the snowy sidewalk.`,
    `Near the big oak tree, she saw something red poking out of the snow.`,
    `Maya pulled it out and shook off the snow.`,
    `It was her mitten!`,
    `She put it on and smiled all the way home.`]]},
  seeds:{title:`Sam's Seeds`,paras:[[
    `Sam wanted to grow his own beans.`,
    `He planted three bean seeds in a paper cup full of dirt.`,
    `He put the cup on the kitchen window, where the sun shines every morning.`,
    `Every day after school, he gave the seeds a little water.`],[
    `For four days, nothing happened.`,
    `Sam was worried that the seeds would never grow.`,
    `Then, on the fifth day, a tiny green sprout pushed up out of the dirt.`,
    `Sam shouted so loudly that his cat jumped off the table.`],[
    `By the next week, the plant had two big leaves.`,
    `Sam measured it with a ruler.`,
    `It was four inches tall!`,
    `"It is too big for this cup now," said Sam.`,
    `"Next, I will plant it in the garden with Grandpa."`]]},
  library:{title:`The Missing Library Book`,paras:[[
    `Ella's library book was due on Friday.`,
    `On Thursday night, she could not find it anywhere.`,
    `She looked under her bed and behind the couch.`,
    `She even looked in the bathtub!`],[
    `"Think about where you read it last," said Mom.`,
    `Ella closed her eyes and thought hard.`,
    `She remembered reading about sharks in the car on the way to soccer.`,
    `Ella and Mom ran out to the car with a flashlight.`,
    `The book was under the back seat, next to a muddy soccer ball.`],[
    `The next day, Ella gave the book back to Mr. Reed at the library.`,
    `Then she checked out a new book about whales.`,
    `This time, she made a special spot for it on her shelf.`]]},
  /* case 2 */
  kitchen:{title:`Grandma's Kitchen`,paras:[[
    `Leo woke up and smelled something sweet.`,
    `He ran into the kitchen.`,
    `Grandma was wearing her flowery apron.`,
    `There was flour on the table and on her nose.`,
    `A timer on the oven was ticking.`,
    `Leo's little dog, Pepper, sat by the door and wagged her tail.`,
    `"Can I have one now?" Leo asked.`,
    `"Not yet," Grandma laughed. "They are still too hot."`]]},
  hamster:{title:`The Class Pet`,paras:[[
    `Every Friday, one student in Ms. Lopez's class takes Nibbles the hamster home.`,
    `This week, it was Ava's turn to take care of him.`,
    `She checked her list of hamster supplies three times.`,
    `At home, she gave Nibbles fresh water every morning and night.`,
    `She built him a tunnel out of an empty paper towel roll.`,
    `On Monday, Ava carried the cage very slowly so it would not shake.`,
    `Ms. Lopez smiled. "Nibbles looks very happy," she said.`]]},
  puppy:{title:`Grandpa's Surprise`,paras:[[
    `On Saturday morning, Grandpa's truck pulled into the driveway.`,
    `In the back was a big box with holes cut in the sides.`,
    `The box wiggled, and Mia heard a tiny "yip!"`,
    `Mia's little brother, Jack, ran and hid behind the couch.`],[
    `Grandpa opened the box, and a puppy with floppy ears tumbled out.`,
    `It ran straight to Mia and licked her hand.`,
    `Mia laughed and gave it a big hug.`,
    `Jack peeked out, but he did not come any closer.`,
    `"Will it bite me?" he whispered.`],[
    `"He is yours to keep," Grandpa said, "but you have to take care of him."`,
    `Mia filled a bowl with water and set it by the door.`,
    `She made a soft bed out of an old blanket.`,
    `She even read a book about puppies so she would know what to do.`,
    `That night, the puppy fell asleep curled up next to Mia's feet.`]]},
  play:{title:`The Class Play`,paras:[[
    `Today was the day of the class play.`,
    `Ruby was going to be the queen.`,
    `All week, she practiced her lines in front of the mirror.`,
    `She even practiced while she brushed her teeth.`,
    `By Friday, she knew every word by heart.`],[
    `Before the play, Ruby peeked out from behind the curtain.`,
    `The room was full of parents holding phones and cameras.`,
    `Her hands felt cold, and her knees were shaking.`,
    `Her friend Max squeezed her hand and said, "You will be great."`],[
    `When the curtain opened, Ruby said her first line in a loud, clear voice.`,
    `Soon her knees stopped shaking.`,
    `At the end, everyone stood up and clapped for a long time.`,
    `Ruby's dad clapped the loudest of all.`]]},
  /* case 3 */
  kite:{title:`The Kite Contest`,paras:[[
    `Jada wanted to win the kite contest at the park.`,
    `First, she built a kite out of paper, sticks, and string.`,
    `When she tried to fly it, the kite crashed into a bush and tore.`,
    `Jada felt like giving up.`,
    `Then her brother helped her tape the hole and add a longer tail.`,
    `On the day of the contest, the wind was strong.`,
    `Jada's kite flew higher than all the others.`,
    `She won a blue ribbon and hung it on her wall.`]]},
  sandcastle:{title:`The Sandcastle Contest`,paras:[[
    `Every summer, the town has a sandcastle contest at the beach.`,
    `This year, Omar and his sister Lina wanted to win.`,
    `They worked all morning to build a castle with four tall towers.`],[
    `Just as they finished, a big wave rushed up the beach.`,
    `It knocked down two of the towers!`,
    `Lina wanted to quit, but Omar had an idea.`,
    `"Let's build a wall of sand to keep the waves away," he said.`,
    `They dug a deep ditch and piled the sand into a thick wall.`,
    `Then they fixed the towers and added shells for windows.`],[
    `When the judges came, the wall was still standing.`,
    `The judges gave Omar and Lina the prize for the smartest castle.`,
    `On the way home, Lina said, "I'm glad we didn't give up."`]]},
  lemonade:{title:`Nia's Lemonade Stand`,paras:[[
    `Nia wanted to buy a new book about space.`,
    `The book cost ten dollars, but she only had two.`,
    `So she set up a lemonade stand in front of her house.`],[
    `At first, nobody stopped.`,
    `Cars zoomed by, and people walked past without looking.`,
    `Nia felt like giving up.`,
    `Then her neighbor, Mr. Diaz, gave her an idea.`,
    `"Make a big, bright sign," he said, "so people can see you."`,
    `Nia painted a sign with a yellow lemon and the words "Cold Lemonade!"`],[
    `Soon, people began to stop.`,
    `By the end of the day, Nia had sold twenty cups.`,
    `The next morning, she walked to the store and bought her space book.`]]},
  /* case 4 */
  penguins:{title:`Penguins`,paras:[[
    `Penguins are birds that are built for cold water.`,
    `Their thick feathers keep them warm and dry.`,
    `A layer of fat under their skin keeps the cold out.`,
    `Their wings work like flippers to help them swim fast.`]]},
  recess:{title:`Recess`,paras:[[
    `At recess, some kids race each other across the field.`,
    `Others climb to the top of the jungle gym.`,
    `A group jumps rope by the fence.`,
    `A few friends play tag near the swings.`]]},
  honey:{title:`How Honey Is Made`,paras:[[
    `Honey starts with flowers.`,
    `First, a honeybee visits many flowers. It drinks a sweet juice called nectar.`,
    `The bee keeps the nectar in a special honey stomach and flies back to the hive.`,
    `Next, the bee passes the nectar to another bee inside the hive.`,
    `The bees spread the nectar into tiny wax rooms called cells.`,
    `Then the bees fan their wings to dry the nectar until it turns thick and sticky.`,
    `Finally, they cover each cell with a wax lid.`,
    `Now the honey is ready, and it can stay good for a very long time.`]]},
  beavers:{title:`Busy Beavers`,paras:[[
    `Beavers are amazing builders.`,
    `They cut down trees with their strong front teeth.`,
    `Then they pile up sticks, rocks, and mud to make a dam across a stream.`,
    `The dam holds back the water and makes a quiet pond.`],[
    `Beavers are also made for swimming.`,
    `Their back feet are webbed like a duck's feet.`,
    `Their flat tail helps them steer in the water.`,
    `They can stay underwater for up to fifteen minutes.`],[
    `In the pond, beavers build a home called a lodge.`,
    `The door to the lodge is underwater, so enemies like wolves cannot get in.`,
    `Inside, there is a dry room where the whole family sleeps.`,
    `In winter, they stay in the lodge and eat bark from branches they saved.`]]},
  camels:{title:`Desert Camels`,paras:[[
    `Camels are built for life in the hot, dry desert.`,
    `Their long, thick eyelashes keep blowing sand out of their eyes.`,
    `They can close their noses to keep sand out, too.`,
    `Their wide, flat feet help them walk on soft sand without sinking.`],[
    `Camels can go a long time without food or water.`,
    `When they find water, they can drink a huge amount very fast.`,
    `Their humps store fat, not water.`,
    `The fat gives them energy when there is no food around.`],[
    `Camels carry heavy bags and people across the desert.`,
    `Some families drink camel milk every day.`,
    `Others use soft camel hair to make warm blankets.`]]},
  /* case 5 */
  spelling:{title:`The Spelling Bee`,paras:[[
    `Nora's hands were shaking as she walked up on the stage.`,
    `Her voice was very quiet when she said, "Hello."`,
    `The first word was "because."`,
    `Nora closed her eyes and spelled it slowly.`,
    `"Correct!" said the judge.`,
    `Nora's face lit up with a big smile.`,
    `After the contest, she saw a boy crying because he missed a word.`,
    `Nora sat next to him and said, "You did great. We can practice together for next time."`]]},
  garden:{title:`Mr. Finn's Garden`,paras:[[
    `Mr. Finn lives next door to Theo.`,
    `Every morning, even when it rains, he goes out to pull weeds in his garden.`,
    `His tomatoes are the biggest on the whole street.`],[
    `One day, Theo hit a baseball over the fence.`,
    `It smashed one of Mr. Finn's tomato plants.`,
    `Theo could have run away, but he walked next door, red in the face.`,
    `"I am so sorry," he said. "I hit that ball."`],[
    `Mr. Finn frowned at the broken plant for a long time.`,
    `Then he patted Theo's shoulder. "Thank you for telling me the truth," he said.`,
    `"Will you help me plant a new one?"`,
    `Theo nodded, and they dug in the dirt together all afternoon.`]]},
  newkid:{title:`The New Kid`,paras:[[
    `On the first day of school, a new girl named Priya stood by the door.`,
    `She held her backpack straps tightly and looked down at the floor.`,
    `At lunch, she sat all by herself.`],[
    `Carlos saw Priya sitting alone.`,
    `He picked up his tray and walked over to her table.`,
    `"Do you want to play tag at recess?" he asked.`,
    `Priya looked up and gave a small smile.`],[
    `At recess, Priya was the fastest runner in the whole class.`,
    `Nobody could tag her!`,
    `She laughed and waved Carlos over to her team.`,
    `By the end of the week, Priya had lots of new friends.`]]}

{
  id:`order`, title:`Tell It in Order`, skill:`MobyMax: Recount a story`,
  after:`Now try it in MobyMax: Recount a story. Look for the problem, the fix, the ending, and the lesson.`,
  learnSay:`To recount a story means to tell what happened, in order. Only tell the big parts. Beginning: Who is in it? What goes wrong? Middle: What do they try? End: How does it get fixed? Many stories teach a lesson. Ask: what did the character learn? Watch me. Ana's dog ran away. She put up signs with his picture. She tied a red ribbon on her bike. A neighbor called to say the dog was in his yard. Ana ran over and hugged her dog. Retelling: Ana's dog ran away, so she put up signs. A neighbor saw one and called, and Ana got her dog back. The red ribbon is a tiny detail, so it stays out. Lesson: asking for help can solve a problem.`,
  learn:`
    <p class="lead">To <b>recount</b> a story means to tell what happened, in order. Only tell the big parts.</p>
    <ol class="habits">
      <li><span><b>Beginning:</b> Who is in it? What goes wrong?</span></li>
      <li><span><b>Middle:</b> What do they try?</span></li>
      <li><span><b>End:</b> How does it get fixed?</span></li>
    </ol>
    <p>Many stories also teach a <b>lesson</b>. Ask: What did the character learn?</p>
    <div class="ex"><div class="ex-l">Watch me</div>
      <p>Ana's dog ran away. She put up signs with his picture. She tied a red ribbon on her bike. A neighbor called to say the dog was in his yard. Ana ran over and hugged her dog.</p>
      <p><b>Retelling:</b> Ana's dog ran away, so she put up signs. A neighbor saw one and called, and Ana got her dog back.</p>
      <p>The red ribbon is a tiny detail, so it stays out.</p>
      <p><b>Lesson:</b> Asking for help can solve a problem.</p></div>`,

{
  id:`paragraphs`, title:`Paragraph Boss`, skill:`MobyMax: Main ideas of paragraphs · Supporting details within paragraphs · Recount informational text`,
  after:`Now try it in MobyMax: Identify main ideas of paragraphs, then Identify supporting details within paragraphs. Find the boss, then the helpers.`,
  learnSay:`Every paragraph has a boss idea. That is the main idea. It is what all the sentences are about. The other sentences are helpers. They tell more about the boss. Dogs make great pets. They love to play. They keep you company. They can learn tricks. The boss is: dogs make great pets. The helpers are: they play, they keep you company, they learn tricks. The umbrella test: does the answer cover every sentence? If it fits only one sentence, it is a helper. Sometimes the boss idea is not written down. Then put the helpers together to find it. To recount a fact text, tell the boss idea of each paragraph, in order.`,
  learn:`
    <p class="lead">Every paragraph has a <b>boss idea</b>. That is the main idea. It is what <i>all</i> the sentences are about. The other sentences are <b>helpers</b>. They tell more about the boss.</p>

      <p><mark>Dogs make great pets.</mark> They love to play. They keep you company. They can learn tricks.</p>
      <p>Boss: <b>Dogs make great pets.</b> Helpers: they play, they keep you company, they learn tricks.</p></div>
    <div class="tip"><b>The umbrella test:</b> Does the answer cover every sentence? If it fits only one sentence, it is a helper.</div>
    <p>Sometimes the boss idea is not written down. Then put the helpers together to find it.</p>
    <p>To <b>recount</b> a fact text, tell the boss idea of each paragraph, in order.</p>`,

/* ---------- state ---------- */
const KEY = `lucy-reading-detective-v1`;
let prog = {};
try { prog = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { prog = {}; }
if (!prog.tries) prog.tries = {};
function save(){ try { localStorage.setItem(KEY, JSON.stringify(prog)); } catch (e) {} }
/* Opening the link with #preview unlocks every case, for adults reviewing the content. */
const preview = () => location.hash === `#preview`;
const unlocked = i => i === 0 || preview() || (prog[LESSONS[i-1].id] || 0) > 0;

let S = { view:`home` };
const app = document.getElementById(`app`);
const canSpeak = `speechSynthesis` in window;

function speak(text){
  if (!canSpeak) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 0.88; speechSynthesis.speak(u); } catch (e) {}
}
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function shuffleMC(q){
  if (q.type !== `mc`) return q;
  const order = shuffle(q.opts.map((_, i) => i));
  const optHints = {};
  if (q.optHints) order.forEach((orig, i) => { if (q.optHints[orig]) optHints[i] = q.optHints[orig]; });
  return { ...q, opts: order.map(i => q.opts[i]), ans: order.indexOf(q.ans), optHints };
}
const esc = s => String(s).replace(/&/g,`&amp;`).replace(/</g,`&lt;`).replace(/>/g,`&gt;`);
const attr = s => esc(s).replace(/"/g,`&quot;`);
const plain = html => html.replace(/<[^>]+>/g, ` `).replace(/\s+/g, ` `).trim();

const STAR = on => `<svg viewBox="0 0 24 24" aria-hidden="true"><path class="${on ? `star-on` : `star-off`}" d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>`;
const stars = (n, cls = `stars`) => `<span class="${cls}" aria-label="${n} of 3 stars">${STAR(n>=1)}${STAR(n>=2)}${STAR(n>=3)}</span>`;
const SPEAKER = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M4 9h4l5-4v14l-5-4H4z"/></svg>`;
const MAG = `<svg class="mag" viewBox="0 0 64 64" aria-hidden="true"><circle cx="26" cy="26" r="17" fill="var(--hl)" stroke="var(--ink)" stroke-width="5"/><path d="M38.5 38.5 56 56" stroke="var(--ink)" stroke-width="8" stroke-linecap="round"/><path d="M17 22a10 10 0 0 1 8-7" stroke="var(--paper)" stroke-width="4" stroke-linecap="round" fill="none"/></svg>`;
const listenBtn = text => canSpeak ? `<button class="listen" data-act="say" data-text="${attr(text)}">${SPEAKER}Listen</button>` : ``;

/* ---------- views ---------- */
function renderHome(){
  const rows = LESSONS.map((l, i) => {
    const st = prog[l.id] || 0, open = unlocked(i);

function lessonBar(){

function renderLearn(){

function renderReady(){

    <h3>Case check: 5 questions</h3>
    <p class="stat">Remember: <b>peek</b> at the question, <b>read</b>, then <b>point</b> to the proof with your finger.</p>
    <p>This story is longer. Get 4 right on the first try to close the case.</p>
    <button class="btn" data-act="startCheck">Start the check</button></div>`;
}

function passageHTML(P, q){
  let n = 0;
  const hl = new Set(S.done ? q.proof || [] : []);
  const tappable = !S.done && (q.type === `tap` || S.pointing);
  const numbered = P.paras.length > 1;
  const paras = P.paras.map((para, pi) => `<p>${numbered ? `<span class="pn" aria-label="Paragraph ${pi+1}">${pi+1}</span>` : ``}${para.map(s => {
    const i = n++;
    const cls = [`s`];
    let live = false;
    if (hl.has(i) || (S.found && S.found.includes(i))) cls.push(`hl`);
    else if (S.tapWrong.has(i)) cls.push(`no`);
    else if (S.tapNear.has(i)) cls.push(`near`);
    else if (tappable) { cls.push(i === S.sel ? `sel` : `tap`); live = true; }
    const attrs = live ? ` role="button" tabindex="0" aria-pressed="${i === S.sel}" data-act="tapS" data-s="${i}"` : ``;
    return `<span class="${cls.join(` `)}"${attrs}>${esc(s)}</span>`;
  }).join(` `)}</p>`).join(``);
  const audio = S.phase === `check` ? `` : listenBtn(P.title + `. ` + P.paras.flat().join(` `));
  const confirm = tappable && S.sel !== null
    ? `<div class="confirm"><button class="btn" data-act="confirmS">This is my proof</button><span class="sk">or tap a different sentence</span></div>` : ``;
  return `<section class="passage"><div class="phead"><h3>${P.title}</h3>${audio}</div>
    <div class="ptext">${paras}</div>${confirm}</section>`;
}

function currentList(){ return S.phase === `guided` ? S.guidedQs : S.checkQs; }

function renderQuestion(){
  const list = currentList();
  const q = list[S.qi], P = PASSAGES[q.p];
  const meta = S.phase === `guided`
    ? `<div class="qmeta"><span>Practice together · ${S.qi+1} of ${list.length}</span></div>`
    : `<div class="qmeta"><span>Question ${S.qi+1} of ${list.length}</span><span class="dots">${list.map((_, i) =>
        `<i class="${i < S.qi ? (S.marks[i] ? `ok` : `miss`) : i === S.qi ? `cur` : ``}"></i>`).join(``)}</span></div>`;

  const qtext = q.concl
    ? `<div class="qtext">${esc(q.ask)}<span class="concl">Conclusion: ${esc(q.q)}</span></div>`
    : `<div class="qtext">${esc(q.q)}${q.ask ? `<br>${esc(q.ask)}` : ``}</div>`;
  const extra = q.opts ? q.opts : q.items ? q.items : [];
  const sayText = (q.concl ? q.ask + ` Conclusion: ` + q.q : q.q + (q.ask ? ` ` + q.ask : ``)) + (extra.length ? ` ` + extra.join(`. `) : ``);

  let body = ``;
  if (q.type === `mc`) {
    const waiting = S.pointing;
    body = `${waiting ? `<p class="step">Step 1: Find your proof in the story. Step 2: Choose.</p>` : ``}
      <div class="opts ${waiting ? `wait` : ``}">${q.opts.map((o, i) => {
      const cls = S.answered && i === q.ans ? `right` : S.wrongOpts.has(i) ? `wrong` : ``;
      const dis = waiting || S.answered || S.wrongOpts.has(i) ? `disabled` : ``;
      return `<button class="opt ${cls}" data-act="opt" data-o="${i}" ${dis}>${esc(o)}</button>`;
    }).join(``)}</div>`;
  } else if (q.type === `tap`) {
    body = S.done ? `` : `<p class="sk">Tap a sentence in the story, then tap "This is my proof."</p>`;
  } else if (q.type === `order`) {
    const picked = S.picked, full = picked.length === q.items.length;
    body = `<div class="slots">${q.items.map((_, k) => {
      const it = picked[k];
      return `<div class="slot ${it !== undefined ? (S.done ? `right` : `full`) : ``}">${it !== undefined ? esc(q.items[it]) : ``}</div>`;
    }).join(``)}</div>
    ${S.done || (full && S.orderWrong) ? `` : `<div class="chips">${S.shuf.map(it =>
      `<button class="chip" data-act="chip" data-c="${it}" ${picked.includes(it) ? `disabled` : ``}>${esc(q.items[it])}</button>`).join(``)}</div>`}
    ${S.orderWrong && !S.done ? `<button class="btn ghost small" data-act="orderRetry">Try the order again</button>` : ``}`;
  }

  const fb = S.fb ? `<div class="fb ${S.fb.kind} pop"><div>${S.fb.html}</div>${listenBtn(plain(S.fb.html))}</div>` : ``;
  const next = S.done ? `<button class="btn" data-act="next">${S.qi + 1 < list.length ? `Next` : S.phase === `guided` ? `On to the check` : `See my score`}</button>` : ``;

  app.innerHTML = lessonBar() + `<div class="qa">
    <section class="question" aria-live="polite">${meta}
      <div class="phead">${qtext}${listenBtn(sayText)}</div>
      ${body}${fb}${next}</section>
    ${passageHTML(P, q)}</div>`;
}

function renderResult(){
  const l = LESSONS[S.li], sc = S.score, pass = sc >= 4;
  const st = sc === 5 ? 3 : sc === 4 ? 2 : 0;
  const secs = Math.round((Date.now() - S.t0) / 1000);
  const time = `${Math.floor(secs / 60)} min ${secs % 60} sec`;
  const nextOpen = S.li + 1 < LESSONS.length;
  const tries = prog.tries[l.id] || 0;
  const withGuide = tries >= l.checks.length;
  app.innerHTML = lessonBar() + `<div class="card center pop">
    ${pass ? `<h3>Case closed!</h3>${stars(st, `big-stars`)}` : `<h3>${sc >= 3 ? `So close!` : `Let's look at the clues again.`}</h3>`}
    <p class="stat">You got <span class="num">${sc} of 5</span> on the first try, in <span class="num">${time}</span>.</p>
    ${pass
      ? `<p>${esc(l.after)}</p>
         <div class="go">${nextOpen ? `<button class="btn" data-act="open" data-i="${S.li+1}">Next case</button>` : ``}
         <button class="btn ghost" data-act="home">All cases</button></div>`
      : `<p>You need 4 to close the case. ${withGuide ? `Ask your guide to sit with you for the next check.` : `The next check has a new story.`}</p>
         <div class="go"><button class="btn" data-act="startCheck">Try a new check</button>
         <button class="btn ghost" data-act="toLearn">Review the trick</button></div>`}
  </div>`;
}

function render(){
  if (S.view === `home`) return renderHome();
  if (S.phase === `learn`) return renderLearn();
  if (S.phase === `ready`) return renderReady();
  if (S.phase === `result`) return renderResult();
  return renderQuestion();
}

/* ---------- flow ---------- */
function currentQ(){
  if (S.phase === `guided` || S.phase === `check`) return currentList()[S.qi];
  return null;
}
function resetQ(){
  const q = currentQ();
  S.answered = false; S.done = false; S.first = true; S.found = null; S.sel = null;
  S.pointing = !!(q && S.phase === `guided` && q.point);
  S.wrongOpts = new Set(); S.tapWrong = new Set(); S.tapNear = new Set(); S.picked = []; S.orderWrong = false;
  S.fb = S.pointing ? { kind:`info`, html:`<b>Point first!</b> Tap the sentence in the story that answers the question.` } : null;
  if (q && q.type === `order`) { let sh; do { sh = shuffle(q.items.map((_, i) => i)); } while (sh.every((v, i) => v === i)); S.shuf = sh; }
}
function finishQ(msg){
  S.done = true; S.pointing = false; S.sel = null;
  if (S.phase === `check`) { S.marks[S.qi] = S.first; if (S.first) S.score++; }
  S.fb = { kind:`good`, html: msg };
}
const PRAISE = [`Yes!`,`You got it!`,`Great detective work!`,`Correct!`];
const praise = () => `<b>${PRAISE[Math.floor(Math.random() * PRAISE.length)]}</b>`;

function onOpt(i){
  const q = currentQ();
  if (S.pointing) return;
  if (i === q.ans) {
    S.answered = true;
    finishQ(`${praise()} ${q.why ? esc(q.why) : `The yellow part of the story is the proof.`}`);
  } else {
    S.first = false; S.wrongOpts.add(i);
    S.fb = { kind:`oops`, html:`<b>Not quite.</b> ${esc((q.optHints && q.optHints[i]) || q.hint)}` };
  }
  render();
}
function onConfirm(){
  const q = currentQ(), i = S.sel;
  if (i === null) return;
  S.sel = null;
  if (S.pointing) {
    if (q.proof.includes(i)) {
      S.pointing = false; S.found = [i];
      S.fb = { kind:`good`, html:`<b>That's your proof!</b> Now choose the answer.` };
    } else {
      S.tapWrong.add(i);
      S.fb = { kind:`oops`, html:`<b>Look again.</b> That sentence is in the story, but does it answer the question? ${esc(q.hint)}` };
    }
  } else if (q.ans.includes(i)) {
    S.found = [i];
    finishQ(`${praise()} That sentence proves it.`);
  } else if (q.near && q.near[i]) {
    S.first = false; S.tapNear.add(i);
    S.fb = { kind:`info`, html:`<b>Close!</b> ${esc(q.near[i])}` };
  } else {
    S.first = false; S.tapWrong.add(i);
    S.fb = { kind:`oops`, html:`<b>Look again.</b> ${esc(q.hint)}` };
  }
  render();
}
function onChip(c){
  const q = currentQ();
  S.picked.push(c);
  if (S.picked.length === q.items.length) {
    if (S.picked.every((v, k) => v === k)) finishQ(`${praise()} That's the right order. The yellow sentences show each step.`);
    else { S.first = false; S.orderWrong = true; S.fb = { kind:`oops`, html:`<b>Not quite.</b> ${esc(q.hint)}` }; }
  }
  render();
}
app.addEventListener(`click`, e => {
  const t = e.target.closest(`[data-act]`); if (!t) return;
  const a = t.dataset.act;
  if (a === `open`) { S = { view:`lesson`, li:+t.dataset.i, phase:`learn` }; window.scrollTo(0,0); }
  else if (a === `home`) { S = { view:`home` }; }
  else if (a === `toLearn`) { S.phase = `learn`; }
  else if (a === `toGuided`) { S.phase = `guided`; S.qi = 0; S.guidedQs = LESSONS[S.li].guided.map(shuffleMC); resetQ(); }
  else if (a === `startCheck`) {
    const l = LESSONS[S.li];
    const n = prog.tries[l.id] || 0;
    prog.tries[l.id] = n + 1; save();
    S.phase = `check`; S.qi = 0; S.score = 0; S.marks = []; S.t0 = Date.now();
    S.checkQs = l.checks[n % l.checks.length].map(shuffleMC); resetQ();
  }
  else if (a === `opt`) return onOpt(+t.dataset.o);
  else if (a === `tapS`) { S.sel = +t.dataset.s; }
  else if (a === `confirmS`) return onConfirm();
  else if (a === `chip`) return onChip(+t.dataset.c);
  else if (a === `orderRetry`) { S.picked = []; S.orderWrong = false; S.fb = null; }
  else if (a === `say`) { speak(t.dataset.text); return; }
  else if (a === `next`) {
    const list = currentList();
    if (S.qi + 1 < list.length) { S.qi++; resetQ(); }
    else if (S.phase === `guided`) { S.phase = `ready`; }
    else {
      S.phase = `result`;
      const st = S.score === 5 ? 3 : S.score === 4 ? 2 : 0;
      const id = LESSONS[S.li].id;
      if (st > (prog[id] || 0)) { prog[id] = st; save(); }
    }
    window.scrollTo(0,0);
  }
  render();
});
app.addEventListener(`keydown`, e => {
  if ((e.key === `Enter` || e.key === ` `) && e.target.matches(`[data-act="tapS"]`)) {
    e.preventDefault(); S.sel = +e.target.dataset.s; render();
    const btn = app.querySelector(`[data-act="confirmS"]`); if (btn) btn.focus();
  }
});
window.addEventListener(`hashchange`, () => { if (S.view === `home`) render(); });

render();
</script>

</html>
